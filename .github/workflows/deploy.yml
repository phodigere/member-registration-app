name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'main'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Get GitHub Runner Public IP
        id: ip
        run: echo "ipv4=$(curl -s https://ipify.org)" >> GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1  # Based on your EC2 host region

      - name: Open EC2 Firewall to GitHub Runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Verify PostgreSQL is reachable via EC2 Tunnel
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5433
          PGUSER: ${{ secrets.PG_USER }}
          PGPASSWORD: ${{ secrets.PG_PASSWORD }}
          PGDATABASE: ${{ secrets.PG_DATABASE }}
          BASTION_HOST: ${{ secrets.EC2_HOST }}
          BASTION_USER: ${{ secrets.EC2_USERNAME }}
          BASTION_KEY: ${{ secrets.SSH_KEY }}
          RDS_DNS: ekameva-database-0-instance-1.c10uiu8660i0.eu-north-1.rds.amazonaws.com
        run: |
          # 1. We remove 'set -e' temporarily so the script keeps running even on failure
          set -uo pipefail
          
          echo "Installing PostgreSQL client utilities..."
          sudo apt-get update && sudo apt-get install -y postgresql-client > /dev/null
          
          echo "=== START DIAGNOSTICS ==="
          
          echo "Diagnostic: Checking environment variable state..."
          if [ -z "$BASTION_HOST" ]; then echo "❌ CRITICAL: BASTION_HOST (EC2_HOST) secret is empty!"; else echo "✅ BASTION_HOST is populated"; fi
          if [ -z "$BASTION_KEY" ]; then echo "❌ CRITICAL: BASTION_KEY (SSH_KEY) secret is empty!"; else echo "✅ BASTION_KEY is populated"; fi
          
          echo "Diagnostic: Writing SSH key..."
          mkdir -p ~/.ssh
          echo "$BASTION_KEY" > ~/.ssh/id_rsa
          KEY_LINES=$(wc -l < ~/.ssh/id_rsa)
          echo "Lines written to id_rsa: $KEY_LINES"
          
          chmod 600 ~/.ssh/id_rsa
          echo "Exit code of chmod: $?"

          echo "Diagnostic: Testing network connectivity to EC2 Host ($BASTION_HOST)..."
          # Checks if port 22 is reachable within 5 seconds
          nc -zv -w 5 "$BASTION_HOST" 22
          echo "Exit code of netcat to EC2: $?"

          echo "Diagnostic: Scanning host keys..."
          ssh-keyscan -v -H "$BASTION_HOST" >> ~/.ssh/known_hosts
          SCAN_EXIT=$?
          echo "Exit code of ssh-keyscan: $SCAN_EXIT"
          
          echo "=== END DIAGNOSTICS ==="
          
          # Force a failure at the end so the deployment doesn't proceed with a broken setup
          echo "Stopping build for debug evaluation. Review logs above."
          exit 1

      - name: Configure SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: 'APP_DIR,BRANCH,REPO_URL,PORT'
          script_path: scripts/deploy.sh
        env:
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          BRANCH: ${{ github.event.inputs.branch || 'main' }}
          REPO_URL: ({{ github.server_url }}){{ github.repository }}.git
          PORT: ${{ vars.APP_PORT || '3000' }}

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd "({APP_DIR:-)HOME/member-registration-app}"
            pm2 describe member-registration-app >/dev/null
            curl -fsS --max-time 10 "http://127.0.0.1:\${PORT:-3000}/health"
            echo

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Host | `${{ secrets.EC2_HOST }}` |"
            echo "| Commit | `${{ github.sha }}` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
