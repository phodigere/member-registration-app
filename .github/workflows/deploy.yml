name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'main'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Get GitHub Runner Public IP
        id: ip
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "ipv4=$RUNNER_IP" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1  # Based on your EC2 host region

      - name: Open EC2 Firewall to GitHub Runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Verify PostgreSQL is reachable via EC2 Tunnel
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5433
          PGUSER: ${{ secrets.PG_USER }}
          PGPASSWORD: ${{ secrets.PG_PASSWORD }}
          PGDATABASE: ${{ secrets.PG_DATABASE }}
          BASTION_HOST: ${{ secrets.EC2_HOST }}
          BASTION_USER: ${{ secrets.EC2_USERNAME }}
          BASTION_KEY: ${{ secrets.SSH_KEY }}
          RDS_DNS: ekameva-database-0-instance-1.c10uiu8660i0.eu-north-1.rds.amazonaws.com
        run: |
          set -euo pipefail
          
          echo "Installing PostgreSQL client utilities..."
          sudo apt-get update && sudo apt-get install -y postgresql-client > /dev/null
          
          echo "Setting up secure deployment SSH identity keys..."
          mkdir -p ~/.ssh
          echo "$BASTION_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$BASTION_HOST" >> ~/.ssh/known_hosts

          echo "Opening background SSH tunnel to target RDS endpoint..."
          nohup ssh -i ~/.ssh/id_rsa -N -L 5433:$RDS_DNS:5432 $BASTION_USER@$BASTION_HOST &
          TUNNEL_PID=$!
          sleep 5

          echo "Executing pre-flight health query check against tunnel loop..."
          if PGPASSWORD="$PGPASSWORD" psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -c 'SELECT 1' >/dev/null; then
            echo "Database layer connectivity verified successfully."
          else
            echo "Database connection failed over open tunnel link!"
            kill $TUNNEL_PID || true
            exit 1
          fi

          echo "Closing local transient test tunnel bridge..."
          kill $TUNNEL_PID || true

      - name: Configure SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: 'APP_DIR,BRANCH,REPO_URL,PORT'
          script: |
            if ! command -v git >/dev/null 2>&1; then
              echo "Git not found. Installing via DNF..."
              sudo dnf install -y git
            fi

            # 2. Automated .env file configuration injector
            TARGET_DIR="${APP_DIR:-$HOME/member-registration-app}"
            echo "Pre-allocating system variables inside: $TARGET_DIR"
            mkdir -p "$TARGET_DIR"
            
            cat << EOF > "$TARGET_DIR/.env"
            PORT=$PORT
            PGHOST=$PGHOST
            PGPORT=$PGPORT
            PGUSER=$PGUSER
            PGPASSWORD=$PGPASSWORD
            PGDATABASE=$PGDATABASE
            SESSION_SECRET=$SESSION_SECRET
            EOF

            chmod 600 "$TARGET_DIR/.env"
            echo "Production environment file created successfully."

          script_path: scripts/deploy.sh
        env:
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          BRANCH: ${{ github.event.inputs.branch || 'main' }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          PORT: ${{ vars.APP_PORT || '3000' }}

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd "({APP_DIR:-)HOME/member-registration-app}"
            pm2 describe member-registration-app >/dev/null
            curl -fsS --max-time 10 "http://127.0.0.1:\${PORT:-3000}/health"
            echo

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Host | `${{ secrets.EC2_HOST }}` |"
            echo "| Commit | `${{ github.sha }}` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
